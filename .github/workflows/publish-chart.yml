name: Publish OCI Helm Chart

on:
  push:
    tags:
      - "chart/v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Github Packages
        run: echo ${{ secrets.GITHUB_TOKEN }} | helm registry login -u ${{ github.repository_owner }} --password-stdin ghcr.io

      - name: Package Chart
        run: make helm.package

      - name: Push Chart
        run: helm push build/cosmoguard-*.tgz oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/helm

      - name: Logout
        run: helm registry logout ghcr.io
