name: Test

on:
  # Pushes to main plus every pull request (fork PRs included). A `branches`
  # filter (rather than `tags-ignore`) is required to exclude tags: specifying
  # only a tag filter would scope the push event to tags. Tags are handled by
  # the release workflows (docker.yml, goreleaser.yml),
  # which call this workflow as a gate via workflow_call.
  push:
    branches:
      - main
  pull_request:
  # Daily run so a new advisory against an idle main reaches govulncheck.
  schedule:
    - cron: "17 5 * * *"
  workflow_call:

permissions:
  contents: read

# Cancel superseded pull request runs; main (including scheduled runs) and
# tags always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # The release workflows gate on this workflow, so a tag that is not strict
  # SemVer (vX.Y.Z or vX.Y.Z-<prerelease>, as helm package requires) fails
  # here before any image, binary or chart is published.
  release-tag:
    name: release tag is SemVer
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          id='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          re="^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-${id}(\\.${id})*)?$"
          if ! [[ "$TAG" =~ $re ]]; then
            echo "::error::tag ${TAG} is not vX.Y.Z or vX.Y.Z-<prerelease>"
            exit 1
          fi
          # The version also becomes the app.kubernetes.io/version label.
          version="${TAG#v}"
          if (( ${#version} > 63 )) || ! [[ "$version" =~ [0-9A-Za-z]$ ]]; then
            echo "::error::version ${version} is not a valid Kubernetes label value (max 63 chars, must end alphanumeric)"
            exit 1
          fi

  test:
    name: go test (race + cover)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: vet
        run: go vet ./...

      - name: staticcheck
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1
        with:
          version: "v0.7.0"
          install-go: false

      - name: test (race + coverage)
        run: make test-cover

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: warn

  fuzz:
    name: short fuzz pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Fuzzing runs on Go 1.27+ rather than go.mod's toolchain: before 1.27
      # the fuzz coordinator can report a spurious "context deadline exceeded"
      # failure when -fuzztime expires (go.dev/issue/75804, fixed in 1.27.0
      # and not backported). Return to go-version-file once go.mod is >= 1.27.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true

      # Cap each target at 10s so a regular PR run takes <1 min total; the
      # scheduled nightly run gives each target 5m for deeper coverage.
      - name: fuzz
        env:
          FUZZTIME: ${{ github.event_name == 'schedule' && '5m' || '10s' }}
        run: make fuzz FUZZTIME="$FUZZTIME"

  helm:
    name: helm chart renders + config loads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: helm lint
        run: >-
          helm lint helm/cosmoguard
          --set-string cluster.existingEncryptionKeySecret=ci-cluster-key

      - name: cluster key render regression matrix
        run: scripts/test-helm-cluster-key.sh

      - name: config reload render regression matrix
        run: scripts/test-helm-config-reload.sh

      - name: hardening render regression matrix
        run: scripts/test-helm-hardening.sh

      - name: cluster mode renders (generated key path)
        run: |
          helm template ci helm/cosmoguard \
            --set config.cache.cluster.enable=true \
            --set config.cache.cluster.discovery.mode=dns \
            --set cluster.generateEncryptionKey=true >/dev/null

      - name: cluster mode fails closed without a key
        run: |
          if helm template ci helm/cosmoguard \
              --set config.cache.cluster.enable=true \
              --set config.cache.cluster.discovery.mode=dns \
              --set cluster.generateEncryptionKey=false >/dev/null 2>&1; then
            echo "::error::chart must refuse cluster mode with no encryption key"
            exit 1
          fi

      # Renders the default values into a config and boots the real binary
      # against it. Catches chart/binary schema drift the Go tests can't see
      # — e.g. a duration field emitted as a bare int that fails to unmarshal.
      # The default is cluster mode, so supply the same runtime env the workload
      # injects (POD_IP for bindAddr, CLUSTER_ENCRYPTION_KEY for the gossip key);
      # the peer-service DNS won't resolve here, which cosmoguard tolerates as a
      # single-node cluster (initial peer lookup warns + retries, non-fatal).
      - name: rendered config loads in the binary
        run: |
          go build -o /tmp/cosmoguard ./cmd/cosmoguard
          helm template ci helm/cosmoguard \
            --set-string cluster.existingEncryptionKeySecret=ci-cluster-key \
            --show-only templates/configmap.yaml \
            | yq '.data["cosmoguard.yaml"]' > /tmp/cosmoguard.yaml
          if ! yq -e '
            .rpc.webSocketConnections == 40 and
            .evm.ws.webSocketConnections == 40 and
            .server.websocketLimits.maxSubscriptionsPerClient == 32 and
            .server.websocketLimits.maxSubscriptionsPerIdentity == 128 and
            .server.websocketLimits.maxSubscriptionsPerUpstreamConnection == 10 and
            .server.websocketLimits.maxConnectionsPerIP == 16
          ' /tmp/cosmoguard.yaml >/dev/null; then
            echo "::error::rendered WebSocket defaults do not match the expected capacity policy:"
            yq '{
              "rpcWebSocketConnections": .rpc.webSocketConnections,
              "evmWebSocketConnections": .evm.ws.webSocketConnections,
              "websocketLimits": .server.websocketLimits
            }' /tmp/cosmoguard.yaml
            exit 1
          fi
          POD_IP=127.0.0.1 \
          CLUSTER_ENCRYPTION_KEY="$(head -c32 /dev/urandom | base64)" \
          /tmp/cosmoguard --config /tmp/cosmoguard.yaml >/tmp/cg.log 2>&1 &
          pid=$!
          sleep 6
          if kill -0 "$pid" 2>/dev/null; then
            echo "config loaded; server healthy"
            kill "$pid" 2>/dev/null || true
          else
            echo "::error::cosmoguard exited during startup — chart rendered a config the binary rejects"
            cat /tmp/cg.log
            exit 1
          fi

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Scans the module (and the source-reachable call graph) against the Go
      # vulnerability database. Fails the build on a known-exploitable CVE in a
      # dependency or the toolchain — a real gate for an auth/cache proxy.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
