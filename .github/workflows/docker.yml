name: Build Cosmoguard Image

# Tags publish a release (versioned image + chart); main publishes the
# rolling `edge` image only.
on:
  push:
    branches:
      - main
    tags:
      - "v*"

# Serialize per ref so an older main build can't overwrite a newer `edge`.
# The group must differ from test.yml's, which a called workflow evaluates
# with this workflow's name.
concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

jobs:
  # Gate the release on the full test suite (race, fuzz, helm render, govulncheck).
  # Reuses test.yml so the release can never ship code the tests reject.
  test:
    uses: ./.github/workflows/test.yml

  version:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      build_version: ${{ steps.extract.outputs.build_version }}
      latest: ${{ steps.extract.outputs.latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # version is the image tag (X.Y.Z[-pre] or `edge`); build_version is
      # what the binary reports. `latest` moves only for the highest stable
      # tag, so a maintenance release on an older line never rewinds it.
      - name: Extract version
        id: extract
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_REF="${GITHUB_REF#refs/tags/}"
            echo "version=${TAG_REF#v}" >> "$GITHUB_OUTPUT"
            echo "build_version=$TAG_REF" >> "$GITHUB_OUTPUT"
            newest=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
            [[ "$TAG_REF" == "$newest" ]] && latest=true || latest=false
            echo "latest=$latest" >> "$GITHUB_OUTPUT"
          else
            echo "version=edge" >> "$GITHUB_OUTPUT"
            echo "build_version=$(git describe --tags --exclude 'chart/*')" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi
  build:
    name: Build and Push Cosmoguard Images
    needs:
      - test
      - version
    strategy:
      fail-fast: true
      matrix:
        build:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.build.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare env vars
        run: |
          OS=$(echo "${{ matrix.build.platform }}" | cut -d '/' -f 1)
          ARCH=$(echo "${{ matrix.build.platform }}" | cut -d '/' -f 2)
          echo "OS=$OS" >> $GITHUB_ENV
          echo "ARCH=$ARCH" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR container register
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: ${{ needs.version.outputs.version }}-${{ env.ARCH }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: ${{ matrix.build.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ needs.version.outputs.build_version }}
            COMMIT=${{ github.sha }}

  merge:
    name: Create Multi-arch Cosmoguard Image
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest,enable=${{ needs.version.outputs.latest == 'true' }}

      - name: Create manifest list and push
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          image=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON" | cut -d ':' -f 1)
          TAGS=$(jq -r '.tags[] | "--tag " + .' <<< "$DOCKER_METADATA_OUTPUT_JSON" | tr '\n' ' ')
          docker buildx imagetools create \
            $TAGS \
            "${image}:${VERSION}-amd64" \
            "${image}:${VERSION}-arm64"
  # Publish the chart only once the multi-arch image exists, so its default
  # image (appVersion, stamped from the same tag) can always be pulled.
  chart:
    name: Publish Helm Chart
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - version
      - merge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package chart
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: make helm.package VERSION="$VERSION"

      - name: Push chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login -u "$GITHUB_REPOSITORY_OWNER" --password-stdin ghcr.io
          helm push build/cosmoguard-*.tgz "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/helm"
          helm registry logout ghcr.io
