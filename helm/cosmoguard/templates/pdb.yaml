{{- if .Values.podDisruptionBudget.enabled -}}
{{- /* An explicit null counts as unset, so a values file can clear either key. */ -}}
{{- $hasMin := ne (toString (index .Values.podDisruptionBudget "minAvailable")) "<nil>" -}}
{{- $hasMax := ne (toString (index .Values.podDisruptionBudget "maxUnavailable")) "<nil>" -}}
{{- if and $hasMin $hasMax -}}
{{- fail "cosmoguard: podDisruptionBudget.minAvailable and .maxUnavailable are mutually exclusive — pick one" -}}
{{- end -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cosmoguard.fullname" . }}
  labels: {{- include "cosmoguard.labels" . | nindent 4 }}
spec:
  {{- if $hasMin }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- end }}
  {{- if $hasMax }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  {{- if not (or $hasMin $hasMax) }}
  minAvailable: 1
  {{- end }}
  selector:
    matchLabels: {{- include "cosmoguard.selectorLabels" . | nindent 6 }}
{{- end -}}
